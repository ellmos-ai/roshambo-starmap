  planetarium.html — a walk-in dome for the invented sky (tasks 36–39).

  Self-contained: no build step, no CDN, no fetch — all data is embedded below

  Opens by double-clicking over file://.

  The sky is invented. None of this is astronomy. RA/Dec are borrowed only as a
  convenient way to place a point on a sphere.

  Sphere math (no 3D library): RA/Dec -> unit vector -> rotate by sky rotation
  about the polar axis -> camera basis from yaw/pitch -> perspective divide.
  Rendered on a 2D canvas with requestAnimationFrame.

  Timelapse method (honest): each data file's birth frame is the git commit that
  first added it, mapped into _timelapse/frames.json (one commit per frame).
  Files committed after the timelapse run ended are clamped to the last frame
  and flagged after=true. See _scripts/build_planetarium.py for details.

  URL parameters:
    ?timelapse=1        show the sky as it grew, commit by commit (slider + play)
    &frame=N            pin the timelapse to frame N (1..76)
    ?morph=1            the map becomes the world: starts on the flat
                        stereographic chart exactly as render.py draws it,
                        bends it around the viewer (t=3..19), settles into the
                        dome, then flows into the camera flight (t>=28).
    ?t=<seconds>        deterministic video mode: camera flies a fixed path
                        (slow orbit, then into two or three constellations and
                        back out). Everything is a pure function of t, so
                        headless screenshots of single frames are reproducible.
    &dur=<seconds>      length of the camera path (default 60)
    &chromeless=1       hide all HUD text (for film frames)
    &yaw=&pitch=&fov=   pin the camera instead of the path (still images)

  Examples (headless Edge):
    msedge --headless --screenshot=f.png --window-size=1920,1080 --virtual-time-budget=2000 ^
      "file:///.../planetarium.html?t=30&chromeless=1"
-->

  ctx.strokeStyle = '#5c6f9c';
  ctx.lineWidth = lerp(1.1 * k, Math.max(0.7, W / 2200), e);
  ctx.globalAlpha = alpha * lerp(0.75, 0.7, e);
  for (const [a, b] of c.lines) {
    const p1 = pts[a], p2 = pts[b];
    if (!p1 || !p2) continue;
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
  }
  for (const s of c.stars) {
    const p = pts[s.id];
    if (p.x < -20 || p.x > W + 20 || p.y < -20 || p.y > H + 20) continue;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = starColour(s);
    ctx.beginPath(); ctx.arc(p.x, p.y, lerp(s.fr * k, starPx(s.mag, zoom), e), 0, TAU); ctx.fill();
    hoverTargets.push({ s, x: p.x, y: p.y });
  }
  ctx.globalAlpha = 1;
  if (alpha > 0.25) {
    const domeC = projectClamped(c.centre, true);
    const px = lerp(ox + k * c.fcx, domeC.x, e), py = lerp(oy + k * c.fcy, domeC.y, e);
    const edge = Math.min(px, W - px, py, H - py);
    let a = alpha * Math.max(0, Math.min(0.85, edge / 120));
    if (labelPlaced.some(q => Math.abs(q.x - px) < 90 && Math.abs(q.y - py) < 30)) a = 0;
    if (a > 0.05) {
      labelPlaced.push({ x: px, y: py });
      ctx.globalAlpha = a;
      ctx.fillStyle = '#8fa3d0';
      ctx.font = `${lerp(15 * k, Math.max(13, H / 72), e)}px Georgia, serif`;
      ctx.textAlign = 'center';
      ctx.fillText(c.name, px, py - lerp(18 * k, Math.max(14, H / 60), e));
      ctx.globalAlpha = 1;
    }
  }
}

function drawHorizon(alphaMul = 1) {
  // Invented horizon: the great circle at dec 0. It does NOT rotate with the
  // sky, so the turning sky drifts past it — that is what tells you which way
  // is down. Drawn as a soft double stroke, sampled every 2 degrees.
  ctx.strokeStyle = '#3a4a74';
  for (const [w, a] of [[Math.max(3, W / 500), 0.10], [Math.max(1, W / 1600), 0.35]]) {
    ctx.lineWidth = w; ctx.globalAlpha = a * alphaMul;
    ctx.beginPath();
    let pen = false;
    for (let ra = 0; ra <= 360; ra += 2) {
      const p = project(vec(ra, 0), false);
      if (p) { pen ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); pen = true; }
      else pen = false;
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function visibleAlpha(birthFrame, pos) {
  if (!P.timelapse) return 1;
  return Math.max(0, Math.min(1, pos - birthFrame + 1));  // fade in over one frame
}

let labelPlaced = [];    // screen spots already holding a name this frame

function render(pos) {
  beginView();
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  hoverTargets = [];
  labelPlaced = [];

  // m: 0 = flat chart, 1 = full dome (only morph mode ever goes below 1)
  const m = P.morph ? morphM : 1;

  if (showHorizon && m > 0.5) drawHorizon(Math.min(1, (m - 0.5) * 2));

  // scatter, river and curiosities are not on the flat chart — they fade in
  // with the morph, at their dome positions
  const ra = visibleAlpha(BIRTH.river, pos) * m;
  if (ra > 0) for (const s of river) drawStar(s, ra * 0.38, 0.5, false);
  const sa = visibleAlpha(BIRTH.scatter, pos) * m;
  if (sa > 0) for (const s of scatter) drawStar(s, sa * 0.6, 0.62, false);
  // constellation figures
  for (const c of constellations) {
    const a = visibleAlpha(c.frame, pos);
    if (a > 0) {
      if (P.morph && m < 1) drawMorphConstellation(c, a, m);
      else drawConstellation(c, a);
    }
  }
  const ca = visibleAlpha(BIRTH.curiosities, pos) * m;
  if (ca > 0) for (const s of curios) drawStar(s, ca, 1.15, true);
}

/* ---------------------------------------------------------- timelapse --- */
const tl = { current: 1, playing: true, lastStep: 0 };
const tlSlider = document.getElementById('tl-slider');
const tlPlay = document.getElementById('tl-play');
const tlCaption = document.getElementById('tl-caption');
tlSlider.max = LAST_FRAME;
tlSlider.addEventListener('input', () => { tl.current = parseFloat(tlSlider.value); });
tlPlay.addEventListener('click', () => { tl.playing = !tl.playing; tlPlay.textContent = tl.playing ? 'pause' : 'play'; });

function updateTimelapse(now, dt) {
  if (deterministic) {
    tl.current = timelapsePos(P.t);
  } else {
    if (P.frame !== null) tl.current = Math.max(1, Math.min(LAST_FRAME, P.frame));
    else if (tl.playing) {
      tl.lastStep += dt;
      if (tl.lastStep > 700) {                       // one commit every 0.7 s
        tl.lastStep = 0;
        tl.current = tl.current >= LAST_FRAME ? 1 : tl.current + 1;
      }
    }
  }
  tlSlider.value = tl.current;
  const f = FRAMES[Math.min(FRAMES.length - 1, Math.max(0, Math.round(tl.current) - 1))];
  if (f) {
    const date = (f.at || '').slice(0, 16).replace('T', ' ');
    tlCaption.innerHTML =
      `frame ${f.i}/${LAST_FRAME} · ${date} UTC — <em>${escapeHtml(f.subject)}</em> ` +
      `<small>(${escapeHtml(f.author)} · ${f.n_constellations} constellations, ${f.n_stars} stars)</small>`;
  }
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
}

/* ------------------------------------------------------------ controls --- */
let dragging = false, lastX = 0, lastY = 0, mouseX = -1, mouseY = -1;
canvas.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; canvas.classList.add('dragging'); });
window.addEventListener('mouseup', () => { dragging = false; canvas.classList.remove('dragging'); });
window.addEventListener('mousemove', e => {
  mouseX = e.clientX; mouseY = e.clientY;
  if (!dragging || deterministic) return;
  const k = cam.fov / 900;
  cam.yaw = (cam.yaw - (e.clientX - lastX) * k + 360) % 360;   // grab the sky
  cam.pitch = Math.max(-89, Math.min(89, cam.pitch + (e.clientY - lastY) * k));
  lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener('wheel', e => {
  if (deterministic) return;
  e.preventDefault();
  cam.fov = Math.max(12, Math.min(110, cam.fov * Math.exp(e.deltaY * 0.001)));
}, { passive: false });
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ') { rotating = !rotating; e.preventDefault(); }
  if (e.key.toLowerCase() === 'h') showHorizon = !showHorizon;
  if (e.key.toLowerCase() === 'r') rotating = !rotating;
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function keyboardLook(dt) {
  if (deterministic) return;
  const s = (cam.fov / 60) * 45 * dt / 1000;   // deg per frame, scaled by zoom
  if (keys['a'] || keys['arrowleft'])  cam.yaw = (cam.yaw + s + 360) % 360;
  if (keys['d'] || keys['arrowright']) cam.yaw = (cam.yaw - s + 360) % 360;
  if (keys['w'] || keys['arrowup'])    cam.pitch = Math.min(89, cam.pitch + s);
  if (keys['s'] || keys['arrowdown'])  cam.pitch = Math.max(-89, cam.pitch - s);
  if (keys['+'] || keys['=']) cam.fov = Math.max(12, cam.fov * 0.99);
  if (keys['-'])              cam.fov = Math.min(110, cam.fov * 1.01);
}

/* -------------------------------------------------------------- tooltip --- */
const tooltip = document.getElementById('tooltip');
function updateTooltip() {
  if (P.chromeless || deterministic || mouseX < 0) { tooltip.style.display = 'none'; return; }
  const dpr = W / canvas.clientWidth;
  const mx = mouseX * dpr, my = mouseY * dpr;
  let best = null, bestD = 14 * dpr;
  for (const h of hoverTargets) {
    const d = Math.hypot(h.x - mx, h.y - my);
    if (d < bestD) { bestD = d; best = h.s; }
  }
  if (!best) { tooltip.style.display = 'none'; return; }
  const label = best.name || best.id;
  tooltip.innerHTML = `<span class="nm">${escapeHtml(label)}</span> · mag ${best.mag} · ${best.sp}` +
    (best.note ? `<div class="nt">${escapeHtml(best.note)}</div>` : '');
  tooltip.style.display = 'block';
  tooltip.style.left = Math.min(window.innerWidth - 320, mouseX + 14) + 'px';
  tooltip.style.top = (mouseY + 14) + 'px';
}

/* ------------------------------------------------------------- main loop --- */
const rotHud = document.getElementById('rot');

/* Morph mode: the flat chart bends into the dome, then the flight begins.
   One continuous, deterministic timeline (seconds):
     0..3    hold the flat chart (exactly what render.py draws)
     3..19   m: 0 -> 1, smoothstepped — the map wraps around the viewer;
             the camera already sits at the dome start (looking up at the
             pole, wide fov), only the interpolation parameter moves
     19..21  settle in the dome
     21..28  camera glides from the polar overhead view to the flight's start
     28..    the existing camera path, sky rotation included
   With ?t= every pixel is a pure function of t; without it, wall clock. */
const MORPH = { HOLD: 3, BEND: 16, SETTLE: 2, GLIDE: 7 };
const MORPH_DOME_T = MORPH.HOLD + MORPH.BEND + MORPH.SETTLE;         // 21
const MORPH_FLIGHT_T = MORPH_DOME_T + MORPH.GLIDE;                   // 28
const MORPH_CAM = { yaw: 180, pitch: 89.5, fov: 150 };  // overhead polar view
let morphM = 1;
const morphStart = performance.now();
function morphDrive(mt) {
  if (mt < MORPH.HOLD) morphM = 0;
  else if (mt < MORPH.HOLD + MORPH.BEND) morphM = smooth((mt - MORPH.HOLD) / MORPH.BEND);
  else morphM = 1;

  if (mt < MORPH_DOME_T) {
    cam.yaw = MORPH_CAM.yaw; cam.pitch = MORPH_CAM.pitch; cam.fov = MORPH_CAM.fov;
    skyRot = 0;
  } else if (mt < MORPH_FLIGHT_T) {
    const u = smooth((mt - MORPH_DOME_T) / MORPH.GLIDE);
    cam.yaw = lerpYaw(MORPH_CAM.yaw, PATH[0].yaw, u);
    cam.pitch = lerp(MORPH_CAM.pitch, PATH[0].pitch, u);
    cam.fov = lerp(MORPH_CAM.fov, PATH[0].fov, u);
    skyRot = 0;
  } else {
    const tt = mt - MORPH_FLIGHT_T;
    const c = cameraAt(tt);
    skyRot = ROT_DEG_PER_S * tt;
    cam.yaw = (c.yaw + skyRot) % 360;   // track the turning sky, as in video mode
    cam.pitch = c.pitch;
    cam.fov = c.fov;
  }
  // pinned-camera overrides also work in morph mode (for stills)
  if (P.yaw !== null) cam.yaw = P.yaw;
  if (P.pitch !== null) cam.pitch = P.pitch;
  if (P.fov !== null) cam.fov = P.fov;
}

let prev = performance.now();
function tick(now) {
  const dt = Math.min(100, now - prev); prev = now;

  if (P.morph) {
    morphDrive(P.t !== null ? P.t : (now - morphStart) / 1000);
  } else if (deterministic) {
    const c = cameraAt(P.t);
    skyRot = ROT_DEG_PER_S * P.t;        // deterministic sky rotation
    // add skyRot to the path yaw so the flight TRACKS the turning sky —
    // otherwise the zoom targets drift out of frame during the close-ups
    cam.yaw = P.yaw !== null ? P.yaw : (c.yaw + skyRot) % 360;
    cam.pitch = P.pitch !== null ? P.pitch : c.pitch;
    cam.fov = P.fov !== null ? P.fov : c.fov;
  } else {
    keyboardLook(dt);
    if (rotating) skyRot = (skyRot + ROT_DEG_PER_S * dt / 1000) % 360;
    rotHud.textContent = rotating ? 'the sky is turning (space to hold it)' : 'the sky is held (space to release)';
  }

  if (P.timelapse) updateTimelapse(now, dt);
  render(P.timelapse ? tl.current : 1);
  updateTooltip();
  requestAnimationFrame(tick);
}
resize();
if (P.timelapse) tl.current = timelapsePos(P.t);
requestAnimationFrame(tick);
</script>
</body>
</html>
